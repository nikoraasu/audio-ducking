name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The APK is signed with the debug keystore (generated by the Android build on first use), which is fine for
      # sideloading. Replace with a real release keystore (from secrets) before publishing to a store.
      - run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          packaging/build-apk.sh "$PWD/AudioDucking-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '*.apk'
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: packaging/build-appimage.sh "$PWD/AudioDucking-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: '*.AppImage'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:packageMsi :shared:packageExe :shared:createDistributable
        shell: bash
      # Flat folder with space-free names: the release step only picks up top-level files.
      - name: Collect Windows files
        shell: pwsh
        run: |
          $b = "shared/build/compose/binaries/main"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem "$b/msi/*.msi")[0] out/AudioDucking-Windows-x64.msi
          Copy-Item (Get-ChildItem "$b/exe/*.exe")[0] out/AudioDucking-Windows-x64-setup.exe
          Compress-Archive -Path "$b/app/*" -DestinationPath out/AudioDucking-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
